name: update-cmux

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump cmux input
        run: nix flake update cmux

      - name: Skip if unchanged
        id: diff
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Only a lockfile that builds reaches main.
      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: nix build -L .#cmux-tui && ./result/bin/cmux-tui --version

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          rev=$(nix flake metadata --json | jq -r '.locks.nodes.cmux.locked.rev')
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "flake.lock: bump cmux to ${rev:0:10}"
          git push
